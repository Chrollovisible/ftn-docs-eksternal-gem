<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Flagshiiip at a glance in three steps"><rect x="1" y="1" width="958" height="258" rx="20" fill="#F2F7F6" stroke="#D5E4E0" stroke-width="2"/><rect x="20" y="50" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="160" cy="50" r="22" fill="#25C2A0"/><text x="160" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text><text x="160" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2B2A">Brand adds a sticker</text><text x="160" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">A sticker with a unique QR</text><text x="160" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">is placed on the packaging</text><line x1="306" y1="130" x2="326" y2="130" stroke="#25C2A0" stroke-width="3"/><polygon points="334,130 322,123 322,137" fill="#25C2A0"/><rect x="340" y="50" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="480" cy="50" r="22" fill="#25C2A0"/><text x="480" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text><text x="480" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2B2A">Product reaches you</text><text x="480" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">You buy the product</text><text x="480" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">as usual</text><line x1="626" y1="130" x2="646" y2="130" stroke="#25C2A0" stroke-width="3"/><polygon points="654,130 642,123 642,137" fill="#25C2A0"/><rect x="660" y="50" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="800" cy="50" r="22" fill="#25C2A0"/><text x="800" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text><text x="800" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2B2A">You scan and check</text><text x="800" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">The app shows the</text><text x="800" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">product's authenticity result</text></svg>