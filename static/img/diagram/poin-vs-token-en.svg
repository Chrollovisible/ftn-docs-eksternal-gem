<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Regular loyalty points compared with the Flagshiiip token"><rect x="1" y="1" width="958" height="328" rx="20" fill="#F2F7F6" stroke="#D5E4E0" stroke-width="2"/><rect x="30" y="25" width="430" height="235" rx="14" fill="#FFFFFF" stroke="#8A9A97" stroke-width="2.5"/><text x="245" y="70" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2B2A">Regular loyalty points</text><circle cx="70" cy="120" r="6" fill="#8A9A97"/><text x="90" y="125" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Kept in one store or app</text><circle cx="70" cy="160" r="6" fill="#8A9A97"/><text x="90" y="165" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Limited to one brand</text><circle cx="70" cy="200" r="6" fill="#8A9A97"/><text x="90" y="205" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Value can fade quickly</text><rect x="500" y="25" width="430" height="235" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><text x="715" y="70" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2B2A">Flagshiiip token</text><circle cx="540" cy="120" r="6" fill="#25C2A0"/><text x="560" y="125" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Kept in your wallet</text><circle cx="540" cy="160" r="6" fill="#25C2A0"/><text x="560" y="165" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Designed to be more flexible</text><circle cx="540" cy="200" r="6" fill="#25C2A0"/><text x="560" y="205" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5F5C">Transparent and long-lasting</text><text x="480" y="300" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">This comparison follows the goals of the Flagshiiip program.</text></svg>