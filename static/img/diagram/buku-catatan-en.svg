<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="A shared notebook copied in many places"><rect x="1" y="1" width="958" height="348" rx="20" fill="#F2F7F6" stroke="#D5E4E0" stroke-width="2"/><rect x="330" y="25" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><text x="480" y="65" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2B2A">A shared notebook</text><text x="480" y="92" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">Records of product authenticity</text><line x1="480" y1="115" x2="160" y2="205" stroke="#25C2A0" stroke-width="3"/><rect x="40" y="205" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><text x="160" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Copy 1</text><text x="160" y="275" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">Stored on different computers</text><line x1="480" y1="115" x2="480" y2="205" stroke="#25C2A0" stroke-width="3"/><rect x="360" y="205" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><text x="480" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Copy 2</text><text x="480" y="275" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">Stored on different computers</text><line x1="480" y1="115" x2="800" y2="205" stroke="#25C2A0" stroke-width="3"/><rect x="680" y="205" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><text x="800" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Copy 3</text><text x="800" y="275" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">Stored on different computers</text><text x="480" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2B2A">All copies must match, so a secret change would be noticed.</text></svg>