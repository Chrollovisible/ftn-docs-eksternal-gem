<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Buyer flow: get the app, scan the QR, see the result, claim a reward"><rect x="1" y="1" width="958" height="258" rx="20" fill="#F2F7F6" stroke="#D5E4E0" stroke-width="2"/><rect x="20" y="50" width="200" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="120" cy="50" r="22" fill="#25C2A0"/><text x="120" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text><text x="120" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Get the app</text><text x="120" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">From Google Play</text><text x="120" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">or the App Store</text><line x1="226" y1="130" x2="246" y2="130" stroke="#25C2A0" stroke-width="3"/><polygon points="254,130 242,123 242,137" fill="#25C2A0"/><rect x="260" y="50" width="200" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="360" cy="50" r="22" fill="#25C2A0"/><text x="360" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text><text x="360" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Scan the QR</text><text x="360" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">Point your camera at</text><text x="360" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">the sticker on the box</text><line x1="466" y1="130" x2="486" y2="130" stroke="#25C2A0" stroke-width="3"/><polygon points="494,130 482,123 482,137" fill="#25C2A0"/><rect x="500" y="50" width="200" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5"/><circle cx="600" cy="50" r="22" fill="#25C2A0"/><text x="600" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text><text x="600" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">See the result</text><text x="600" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">A certificate of</text><text x="600" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">authenticity appears</text><line x1="706" y1="130" x2="726" y2="130" stroke="#25C2A0" stroke-width="3"/><polygon points="734,130 722,123 722,137" fill="#25C2A0"/><rect x="740" y="50" width="200" height="160" rx="14" fill="#FFFFFF" stroke="#25C2A0" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="840" cy="50" r="22" fill="#25C2A0"/><text x="840" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text><text x="840" y="115" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2B2A">Claim a reward</text><text x="840" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">If available for</text><text x="840" y="165" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5F5C">this product</text></svg>